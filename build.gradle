plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = maven_group

base {
    archivesName = archives_base_name
}

// Minecraft 1.20.1 runs on Java 17.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    // 'official' is Mojang's own mapping set, licensed for use under their EULA.
    mappings channel: mapping_channel, version: mapping_version

    // Makes the IDE's resource output visible to the run configs, so mods.toml changes
    // don't need a Gradle build to show up.
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Nothing extra; the mod does all of its work on the client.
        }

        server {
            args '--nogui'
        }
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // ForgeGradle adds the repositories needed for Minecraft and Forge itself automatically.
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors
        ])
    }

    from('LICENSE.txt') {
        rename { "${it}_${archives_base_name}" }
    }

    // Forge needs the jar remapped from Mojang names back to the obfuscated/SRG names.
    finalizedBy 'reobfJar'
}

// configure the maven publication
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = archives_base_name
            artifact jar
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
